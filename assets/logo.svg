<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Disk Salvage</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <clipPath id="photo"><rect x="340" y="400" width="340" height="300" rx="28"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0B1B4D" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#bg)"/>

  <!-- memory card -->
  <path filter="url(#shadow)" fill="url(#card)"
        d="M330 176 H608 L732 300 V808 Q732 852 688 852 H330 Q286 852 286 808 V220 Q286 176 330 176 Z"/>
  <g fill="#93C5FD">
    <rect x="344" y="220" width="38" height="96" rx="10"/>
    <rect x="404" y="220" width="38" height="96" rx="10"/>
    <rect x="464" y="220" width="38" height="96" rx="10"/>
    <rect x="524" y="220" width="38" height="96" rx="10"/>
  </g>

  <!-- the recovered photo -->
  <rect x="340" y="400" width="340" height="300" rx="28" fill="#DBEAFE"/>
  <g clip-path="url(#photo)">
    <circle cx="598" cy="478" r="44" fill="#F59E0B"/>
    <polygon points="420,700 588,548 700,660 700,700" fill="#60A5FA"/>
    <polygon points="330,700 466,520 600,700" fill="#1D4ED8"/>
  </g>

  <!-- restore badge -->
  <circle cx="742" cy="790" r="158" fill="#10B981" stroke="#FFFFFF" stroke-width="26"/>
  <path d="M742 708 A82 82 0 1 1 660 790" fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round"/>
  <polygon points="660,722 616,800 704,800" fill="#FFFFFF"/>
</svg>
