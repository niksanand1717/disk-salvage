<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Disk Salvage</title>
  <defs>
    <radialGradient id="tile" cx="0.5" cy="0.45" r="0.7">
      <stop offset="0" stop-color="#13202C"/>
      <stop offset="1" stop-color="#060A0F"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0.5" y1="0.5" x2="0.9" y2="0">
      <stop offset="0" stop-color="#3BE08A" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#3BE08A" stop-opacity="0.45"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tileClip"><rect x="32" y="32" width="960" height="960" rx="200"/></clipPath>
  </defs>

  <!-- tile -->
  <rect x="32" y="32" width="960" height="960" rx="200" fill="url(#tile)"/>
  <g clip-path="url(#tileClip)">
    <!-- radar: rings, crosshair, sweep -->
    <g fill="none" stroke="#3BE08A" stroke-opacity="0.22" stroke-width="5">
      <circle cx="512" cy="512" r="390"/>
      <circle cx="512" cy="512" r="290"/>
      <circle cx="512" cy="512" r="190"/>
      <line x1="512" y1="60" x2="512" y2="964"/>
      <line x1="60" y1="512" x2="964" y2="512"/>
    </g>
    <path d="M512 512 L512 122 A390 390 0 0 1 849.7 317 Z" fill="url(#sweep)"/>
    <line x1="512" y1="512" x2="849.7" y2="317" stroke="#3BE08A" stroke-opacity="0.8" stroke-width="6"/>
  </g>
  <rect x="32" y="32" width="960" height="960" rx="200" fill="none" stroke="#22364A" stroke-width="8"/>

  <!-- HUD corner brackets -->
  <g fill="none" stroke="#FFB020" stroke-width="22" stroke-linecap="square">
    <path d="M150 260 V150 H260"/>
    <path d="M764 150 H874 V260"/>
    <path d="M874 764 V874 H764"/>
    <path d="M260 874 H150 V764"/>
  </g>

  <!-- memory card -->
  <path d="M380 300 H596 L668 372 V700 Q668 728 640 728 H380 Q352 728 352 700 V328 Q352 300 380 300 Z"
        fill="#0C151E" stroke="#FFB020" stroke-width="26" stroke-linejoin="round"/>
  <g fill="#FFB020">
    <rect x="392" y="336" width="26" height="62" rx="5"/>
    <rect x="434" y="336" width="26" height="62" rx="5"/>
    <rect x="476" y="336" width="26" height="62" rx="5"/>
    <rect x="518" y="336" width="26" height="62" rx="5"/>
  </g>
  <!-- photo: mountains + the "sun" as a radar blip -->
  <polygon points="386,690 470,560 524,630 562,590 634,690" fill="#FFB020"/>
  <circle cx="586" cy="486" r="34" fill="#3BE08A" filter="url(#glow)"/>
  <circle cx="586" cy="486" r="58" fill="none" stroke="#3BE08A" stroke-opacity="0.5" stroke-width="6"/>
</svg>
