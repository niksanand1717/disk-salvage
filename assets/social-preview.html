<!doctype html>
<!-- Rendered to social-preview.png (1280x640) by app/scripts/render-assets.cjs -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  html { background: #0B1530; }           /* keeps body's background on the body box, not the window */
  body {
    font-family: "Segoe UI", "Inter", "Helvetica Neue", Arial, sans-serif;
    color: #F8FAFC;
    background:
      radial-gradient(900px 500px at 85% 110%, rgba(16, 185, 129, .22), transparent 60%),
      radial-gradient(800px 600px at 0% 0%, rgba(2, 132, 199, .35), transparent 60%),
      linear-gradient(135deg, #0B1530 0%, #12224A 100%);
    display: flex; align-items: center; gap: 56px; padding: 0 88px; box-sizing: border-box;
    position: relative;
  }
  /* faint "sectors" grid: a nod to scanning a disk */
  body::before {
    content: ""; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(148,163,184,.07) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(148,163,184,.07) 1px, transparent 1px);
    background-size: 32px 32px;
  }
  img { width: 280px; height: 280px; flex: none; position: relative; filter: drop-shadow(0 24px 40px rgba(0,0,0,.45)); }
  .text { position: relative; }
  h1 { font-size: 88px; line-height: 1; margin: 0 0 22px; font-weight: 700; letter-spacing: -1.5px; }
  p { margin: 0; font-size: 32px; line-height: 1.35; color: #CBD5E1; max-width: 720px; }
  .chips { display: flex; gap: 12px; margin-top: 34px; flex-wrap: wrap; }
  .chip { font-size: 21px; padding: 8px 16px; border-radius: 999px; background: rgba(255,255,255,.08);
          border: 1px solid rgba(255,255,255,.16); color: #E2E8F0; }
  .chip.green { background: rgba(16,185,129,.18); border-color: rgba(16,185,129,.5); color: #A7F3D0; }
</style>
</head>
<body>
  <img src="logo.svg" alt="">
  <div class="text">
    <h1>Disk Salvage</h1>
    <p>Recover photos and videos from damaged drives, memory cards and disk images.</p>
    <div class="chips">
      <span class="chip green">Free &amp; open source</span>
      <span class="chip">Windows</span><span class="chip">macOS</span><span class="chip">Linux</span>
      <span class="chip">Read-only</span>
    </div>
  </div>
</body>
</html>
