name: Build installers

# Builds the Windows .exe files, the macOS .dmg and the Linux .AppImage, .deb and .rpm.
# Runs when a release is published (and attaches the files to it), or by hand from the Actions tab.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write          # to attach the installers to the release

jobs:
  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install rpm tools (for the .rpm package)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: python -m pip install pyinstaller
      - run: npm ci
      - run: npm run dist
        env:
          SALVAGE_PYTHON: python
          CSC_IDENTITY_AUTO_DISCOVERY: "false"     # unsigned builds
      - uses: actions/upload-artifact@v4
        with:
          name: disk-salvage-${{ runner.os }}
          path: |
            app/release/*.exe
            app/release/*.dmg
            app/release/*.AppImage
            app/release/*.deb
            app/release/*.rpm
          if-no-files-found: error
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          gh release upload "${{ github.ref_name }}" release/*.exe release/*.dmg release/*.AppImage \
            release/*.deb release/*.rpm --clobber
